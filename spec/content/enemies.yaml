# 敵人原型定義
# 屬性預算與武器生成公式見 01-primitives.md
# 首領標記由副本場景配置（見 content/dungeons.yaml）

# ─── 縮放參數 ───

scaling:
  budget: "(40 + 16 × floor) × (boss ? 1.4 : 1)"
  attrFormula: "10 + round(budget × weight ÷ totalWeights)"
  attrClamp: [0, 255]
  weaponMin: "round((3 + 1.6 × floor) × damageMult × (boss ? 1.15 : 1))"
  weaponMax: "round((6 + 2.6 × floor) × damageMult × (boss ? 1.15 : 1))"
  armor: "round(floor × 0.8) + (boss ? 4 : 0)"

rankBudgets:
  D: 60
  C: 90
  B: 135
  A: 200
  S: 300

