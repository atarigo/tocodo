# 技能定義
# 規則見 02-pipeline.md（傷害管線）、03-tags.md（tag 相容性）
# 公式見 01-primitives.md
#
# canBeParried/canBeBlocked 由 tag 在攻擊表規則中自動決定（見 04-attack-table.md）
# canCrit 由各技能個別宣告（預設 false）

# ═══════════════════════════════════════
# 近戰技
# ═══════════════════════════════════════

heavy-slash:
  name: 重斬
  rank: D
  tags: [melee, physical, attack]
  action: strike
  cooldown: 6
  mpCost: 0
  canCrit: true
  modifiers:
    - target: damage.mult
      value: 1.8
  price: 4000

rend:
  name: 撕裂
  rank: D
  tags: [melee, physical, attack]
  action: strike
  cooldown: 8
  mpCost: 0
  modifiers:
    - target: damage.mult
      value: 1.0
  onHit:
    - effect: bleed
      rank: D
      duration: 6
      amount: 3
  price: 4000

armor-break:
  name: 破甲擊
  rank: C
  tags: [melee, physical, attack]
  action: strike
  cooldown: 10
  mpCost: 0
  modifiers:
    - target: damage.mult
      value: 1.2
  onHit:
    - effect: armor-break
      rank: C
      duration: 8
      amount: -8
  price: 15000

charged-slash:
  name: 蓄力斬
  rank: C
  tags: [melee, physical, attack]
  action: cast
  castTime: 1.2
  cooldown: 12
  mpCost: 0
  canCrit: true
  modifiers:
    - target: damage.mult
      value: 3.0
  price: 15000

leech-slash:
  name: 吸血斬
  rank: C
  tags: [melee, physical, attack]
  action: strike
  cooldown: 9
  mpCost: 0
  modifiers:
    - target: damage.mult
      value: 1.2
  onHit:
    - heal:
        base: 5
        scaling:
          vit: 0.15
  price: 15000

