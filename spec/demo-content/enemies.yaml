# 敵人原型定義
# 屬性預算公式見 01-primitives.md
# 首領標記由副本場景配置（見 content/dungeons.yaml）

# ─── 原型欄位說明 ───
#
# name:        一般顯示名稱
# bossName:    在場景中被標記為 boss 時使用的名稱
# tags:        戰鬥行為標籤，告訴引擎這隻怪的攻擊類型（melee/ranged/physical/magical 等）
# equipment:   裝備配置（引用裝備 ID），與主角、NPC 共用同一套結構
# weights:     屬性點數分配比例（整數，由 loader 正規化）
# skills:      這隻怪會使用的技能 ID 列表
# items:       攜帶的消耗道具 ID 列表
# speed:       移動速度（像素/秒），決定巡邏和追擊的快慢
# alertRange:  偵測距離（像素），在此範圍內主動發現玩家
# leashRange:  追擊極限（像素），超過就放棄追擊回到原位
# radius:      碰撞圓半徑（像素），用在碰撞偵測和畫面顯示
# color:       顯示顏色（十六進位），畫面上區分敵人

# ─── 原型定義 ───

