# 天生裝備定義
# 不可取得、不可掉落（無 price 欄位）
# 所有 entity 皆可使用，由設定檔決定

# ─── 天生武器 ───

wolf-claw:
  name: 狼爪
  rank: D
  tags: [weapon, melee, physical]
  provides:
    - target: damage.base.min
      value: 5
    - target: damage.base.max
      value: 10
    - target: damage.balance
      value: 0.50
    - target: attack.interval
      value: 1.3
    - target: attackTable.parry
      value: 0.03

corrupted-blade:
  name: 腐化巨劍
  rank: D
  tags: [weapon, melee, physical, two_handed]
  provides:
    - target: damage.base.min
      value: 14
    - target: damage.base.max
      value: 28
    - target: damage.balance
      value: 0.40
    - target: attack.interval
      value: 2.4
    - target: attackTable.parry
      value: 0.08

void-gun:
  name: 虛空槍
  rank: D
  tags: [weapon, ranged, gun, physical, two_handed]
  provides:
    - target: damage.base.min
      value: 11
    - target: damage.base.max
      value: 19
    - target: damage.balance
      value: 0.60
    - target: attack.interval
      value: 1.9
    - target: attackTable.parry
      value: 0

dark-staff:
  name: 闇法杖
  rank: D
  tags: [weapon, melee, staff, magical, two_handed]
  provides:
    - target: damage.base.min
      value: 4
    - target: damage.base.max
      value: 8
    - target: damage.balance
      value: 0.45
    - target: attack.interval
      value: 2.2
    - target: attackTable.parry
      value: 0.05
    - target: cast.time
      op: "×"
      value: 0.85

# ─── 天生護甲 ───

corrupted-plate:
  name: 腐化甲
  rank: D
  tags: [armor, body]
  provides:
    - target: defense.armor
      value: 8
    - target: defense.reductionRate
      value: 0.06

void-coat:
  name: 虛空外衣
  rank: D
  tags: [armor, body]
  provides:
    - target: defense.armor
      value: 3
    - target: defense.reductionRate
      value: 0.02
