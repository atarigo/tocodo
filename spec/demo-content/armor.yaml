# 非武器裝備定義（防具、盾牌、頸飾、手飾、腰帶）
# 所有裝備統一按部位管理，走同一套 provides 格式
# 空身沒有防禦：護甲值全部來自裝備

# ─── 防具 ───

leather-armor:
  name: 皮甲
  rank: D
  tags: [armor, body]
  provides:
    - target: defense.armor
      value: 6
  price: 4000

cloth-robe:
  name: 布袍
  rank: D
  tags: [armor, body]
  provides:
    - target: defense.armor
      value: 3
    - target: attribute.wil
      op: "+"
      value: 15
  price: 4000

chainmail:
  name: 鎖子甲
  rank: C
  tags: [armor, body]
  provides:
    - target: defense.armor
      value: 12
    - target: attribute.agi
      op: "+"
      value: -10
  price: 15000

plate-armor:
  name: 重板甲
  rank: B
  tags: [armor, body]
  provides:
    - target: defense.armor
      value: 22
    - target: defense.reductionRate
      value: 0.08
    - target: attribute.agi
      op: "+"
      value: -25
  price: 50000

