# 非武器裝備定義（防具、盾牌、頸飾、手飾、腰帶）
# 所有裝備統一按部位管理，走同一套 provides 格式
# 空身沒有防禦：護甲值全部來自裝備

# ─── 盾牌 ───

wooden-shield:
  name: 木盾
  rank: D
  tags: [shield, offhand]
  provides:
    - target: defense.armor
      value: 1
    - target: attackTable.block
      value: 0.25
  price: 4000

