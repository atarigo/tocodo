# 場景定義
# 場景是戰鬥的基本單位，可被不同副本共用
# enemies/allies/neutrals 使用原型 ID（對應 enemies.yaml）

# ═══════════════════════════════════════
# 規格範例場景
# ═══════════════════════════════════════

wild-encounter:
  name: 野外遭遇
  enemies:
    - archetype: bloodhound
      count: 3
  victoryConditions:
    - kind: killAll
      requirement: required
  rewardPoints: 200

warrior-challenge:
  name: 戰士的挑戰
  enemies:
    - archetype: corrupted-warrior
      count: 2
    - archetype: bloodhound
      count: 1
      boss: true
  victoryConditions:
    - kind: killAll
      requirement: required
    - kind: survive
      requirement: optional
      seconds: 60
      bonusPoints: 100
  rewardPoints: 400

